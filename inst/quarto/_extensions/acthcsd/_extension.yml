title: ACTHCSD HTML (Epidemiology)
author: ACT Health & Community Services Directorate, Epidemiology Section
version: 1.1.0
quarto-required: ">=1.4.0"

# Referenced from a document as:  format: acthd-html
#
# The `acthd` identifier records which brand palette this format carries, not
# the current name of the directorate. A sibling `acthcd` extension with the
# newer colours can live alongside it without either having to be renamed.
#
# Version this file independently of the actepir package version. When the
# corporate palette or layout shifts, bumping the number here records what a
# given report was actually built against.

contributes:
  formats:
    html:

      # ---- structure ---------------------------------------------------
      toc: true
      toc-location: left
      toc-depth: 3
      toc-expand: true
      page-layout: article
      smooth-scroll: true
      grid:
        margin-width: 250px
        body-width: 900px

      # ---- code --------------------------------------------------------
      code-fold: true
      code-link: false
      code-overflow: scroll
      code-tools:
        source: true
        toggle: true
        caption: none

      # ---- margin content ----------------------------------------------
      tbl-cap-location: margin
      fig-cap-location: margin
      reference-location: margin
      lightbox: true

      # ---- branding ----------------------------------------------------
      title-block-banner: #27015F"
      css: acthcsd.css

      # ---- output ------------------------------------------------------
      # embed-resources supersedes the deprecated self-contained option;
      # setting both (as the original template did) now raises a warning.
      embed-resources: true
