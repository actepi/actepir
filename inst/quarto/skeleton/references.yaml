---
# CSL-YAML bibliography. Cite in the document with [@id], e.g. [@rcore].
#
# Both entries below are cited in the dependencies paragraph of the skeleton, so
# the mechanism is working the moment the document renders. The tidyverse author
# list is abbreviated - citation("tidyverse") and citation() regenerate both
# entries in full whenever you want them exact.

references:

- id: rcore
  type: book
  author:
    - { literal: "R Core Team" }
  title: "R: A Language and Environment for Statistical Computing"
  publisher: "R Foundation for Statistical Computing"
  publisher-place: "Vienna, Austria"
  issued: { date-parts: [[2025]] }
  URL: "https://www.R-project.org/"

- id: tidyverse
  type: article-journal
  author:
    - { family: Wickham, given: Hadley }
    - { family: Averick, given: Mara }
    - { family: Bryan, given: Jennifer }
    - { family: Chang, given: Winston }
  title: "Welcome to the tidyverse"
  container-title: Journal of Open Source Software
  volume: '4'
  issue: '43'
  page: '1686'
  issued: { date-parts: [[2019]] }
  DOI: 10.21105/joss.01686
